name: MXZ6 schedule watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'watchdog.py'
      - '.github/workflows/mxz6-watchdog.yml'
  schedule:
    - cron: '2-57/5 6-19 * * 1-5'
    - cron: '4-59/5 6-19 * * 1-5'

permissions:
  contents: read
  actions: write

# Keep one bounded heartbeat running; the latest pending worker takes over.
concurrency:
  group: mxz6-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Five-minute heartbeat and bounded cron-gap recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -u watchdog.py
